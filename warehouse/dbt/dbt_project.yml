name: build_to_book
version: "0.1.0"
config-version: 2

profile: build_to_book

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Fail rather than guess. A model that references a column that no longer
# exists should break the build, not silently produce nulls.
vars:
  # Prefix applied to every layer schema. Empty for a normal run; the Phase 6
  # failure demo passes `sandbox_` so it cannot rebuild production staging or
  # marts. See macros/generate_schema_name.sql for why this is explicit rather
  # than derived from the target schema.
  schema_prefix: ""

  # Bounds the BOM explosion's recursion. A cyclic extract then fails fast with
  # visibly truncated output rather than hanging a nightly run. Set well above
  # the real depth (rack -> tray -> component is 2) so a legitimate deepening
  # of the product structure does not silently lose levels.
  max_bom_depth: 10

  # Three-way match tolerances (CTRL-004). Configuration rather than a number
  # buried in SQL, so the control's sensitivity is reviewable.
  #
  # Quantity is absolute and zero: a part either arrived or it did not, and
  # "about the right number of GPUs" is not a thing.
  three_way_match_quantity_tolerance: 0
  # Price is a percentage, because a cent on a cable is noise and a cent on a
  # GPU tray is not. 0.5% allows for rounding on a weighted average across
  # several invoices without admitting a real price difference.
  three_way_match_price_tolerance_pct: 0.005

  # The last step on the MES route. "Completed" means a unit passed this step,
  # so CTRL-005 depends on it naming the same step generator/config.yaml puts
  # last. It was a literal in stg_mes_unit_events; a route change would then
  # have left nothing marked as the final step, every order showing zero MES
  # completions, and CTRL-005 reporting a gap on all 8,000 of them -- loud, but
  # pointing at the wrong thing. tests/test_dbt_project.py pins the two
  # together.
  mes_final_step: final_test

flags:
  send_anonymous_usage_stats: false
  require_explicit_package_overrides_for_builtin_materializations: true
  source_freshness_run_project_hooks: true

models:
  build_to_book:
    +persist_docs:
      # Column descriptions end up as COMMENT ON in Postgres, so the warehouse
      # itself carries the data dictionary -- not just the generated docs site.
      relation: true
      columns: true

    staging:
      +schema: staging
      +materialized: view
      # Staging is rename/cast/standardise only. Views keep it cheap and make
      # it obvious that no business logic belongs here.

    intermediate:
      +schema: intermediate
      +materialized: ephemeral
      # Ephemeral by default: intermediate models are build-time plumbing, not
      # objects a consumer should query. Promote to table where a CTE gets too
      # large to plan well.

    marts:
      +schema: marts
      +materialized: table
      # Marts are what the publish gate swaps into reporting, so they must be
      # real tables.

snapshots:
  build_to_book:
    +target_schema: snapshots
    # SCD Type 2 on material master and standard cost (ADR-007).
    +strategy: check
    +invalidate_hard_deletes: true

seeds:
  build_to_book:
    +schema: seeds
    +quote_columns: false

tests:
  build_to_book:
    # A failing test must stop the build, not warn. A warned-about test result
    # has the same practical effect as no test (ADR-010).
    +severity: error
    +store_failures: true
    +schema: dbt_test_failures
