version: 2

models:
  - name: int_bom_exploded
    description: >
      GRAIN: one row per (top-level parent, component, path through the BOM).

      Explodes the parent-child BOM into component requirements with a
      recursive CTE (ADR-025), multiplying quantities down each path. A
      component reachable by more than one path -- the same tray goes into
      several rack configurations -- appears once per path; consumers sum them.

      Guarded two ways against a cyclic BOM: a depth bound, and a visited-path
      array the recursion refuses to revisit. Neither can fail today because
      the generator builds a strict hierarchy; they exist because trusting the
      generator is what a planted defect would break.
    columns:
      - name: bom_path_key
        description: Surrogate key over (top material, component, path).
        data_tests: [unique, not_null]
      - name: top_material_number
        data_tests: [not_null]
      - name: component_material_number
        data_tests: [not_null]
      - name: total_quantity_per
        description: Quantities multiplied along this path.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              name: exploded_quantity_is_positive
              arguments:
                expression: "> 0"
      - name: bom_level
        description: Levels traversed. 1 is a direct child.
        data_tests: [not_null]
      - name: is_leaf
        description: True when the component has no BOM of its own -- a bought part.
        data_tests: [not_null]

  - name: int_component_requirements
    description: >
      GRAIN: one row per (top-level material, leaf component).

      Total quantity of each bought part needed to build one top-level
      material, summed across every path that reaches it.

      Only leaves are counted. Including sub-assemblies would double-count: a
      rack needs 3 trays AND the 21 GPUs inside them, so summing both would
      claim 24 items of which 3 are containers for the other 21.
    columns:
      - name: component_requirement_key
        data_tests: [unique, not_null]
      - name: top_material_number
        data_tests: [not_null]
      - name: component_material_number
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_material_current')
                field: material_number
      - name: quantity_required
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              name: required_quantity_is_positive
              arguments:
                expression: "> 0"
      - name: path_count
        description: How many distinct BOM paths reach this component.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [top_material_number, component_material_number]

  - name: int_three_way_match
    description: >
      GRAIN: one row per purchase order line.

      The three-way match (CTRL-004): PO line, goods receipt and supplier
      invoice must agree on quantity and price.

      EVERY PO line appears, matched or not, because the unmatched ones are the
      finding. An inner join would hide exactly the rows worth looking at.
      Open commitments (ORDERED_NOT_RECEIVED) and goods-received-not-invoiced
      balances are normal and are not treated as exceptions.

      Note what this model cannot see: it is driven FROM purchase order lines,
      so an invoice line referencing a PO line that does not exist is excluded
      by the join rather than flagged by it. CTRL-009 covers that separately.
    columns:
      - name: match_key
        data_tests: [unique, not_null]
      - name: po_number
        data_tests: [not_null]
      - name: match_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - MATCHED
                  - ORDERED_NOT_RECEIVED
                  - RECEIVED_NOT_INVOICED
                  - INVOICED_NOT_RECEIVED
                  - QUANTITY_MISMATCH
                  - PRICE_MISMATCH
      - name: quantity_ordered
        data_tests: [not_null]
      - name: quantity_received
        data_tests: [not_null]
      - name: quantity_invoiced
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [po_number, po_item]
      # Every PO line must be classified -- a NULL status would mean a case
      # the CASE expression does not handle.
      - dbt_utils.expression_is_true:
          name: every_po_line_is_classified
          arguments:
            expression: "match_status is not null"

  - name: int_mes_to_erp_completion
    description: >
      GRAIN: one row per production order.

      CTRL-005: units MES says passed final test against units ERP confirmed.
      The two systems count a finished unit at different moments, so the gap
      is the finding -- which is why this reports the difference rather than
      asserting equality.

      EVERY order appears, confirmed or not. An order with MES activity and no
      confirmation is the serious case -- units built and never reported to
      finance -- and an inner join would hide exactly that.
    columns:
      - name: order_number
        data_tests: [unique, not_null]
      - name: mes_units_completed
        data_tests: [not_null]
      - name: erp_units_confirmed
        data_tests: [not_null]
      - name: completion_gap
        description: >
          MES completed minus ERP confirmed. Positive means output was built
          and never confirmed, which is the direction that matters.
        data_tests: [not_null]
      - name: completion_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - RECONCILED
                  - COMPLETION_GAP
                  - MES_WITHOUT_CONFIRMATION
                  - NO_MES_ACTIVITY

  - name: int_inbound_delivery_performance
    description: >
      GRAIN: one row per inbound delivery line (inbound_delivery,
      shipment_item).

      The keyed ASN-to-receipt join ADR-026 exists for. A receipt carries the
      delivery it arrived on, so this joins on a key rather than guessing from
      purchase order line and date -- which matters because partial deliveries
      mean one order line can have two shipments.

      EVERY delivery line appears. An in-transit line is an open commitment,
      not a missing receipt, and an inner join would delete exactly the rows
      that make the distinction visible.

      Exposes the ingredients of supplier on-time delivery and stops short of
      the metric: both the by-line and by-shipment groupings are available
      from this grain, and the definition is BTB-44's to make.
    columns:
      - name: inbound_delivery
        data_tests: [not_null]
      - name: quantity_shipped
        data_tests: [not_null]
      - name: quantity_received
        description: Zero on an in-transit line, because nothing has arrived.
        data_tests: [not_null]
      - name: quantity_in_transit
        description: >
          Shipped minus received. Zero on every received line by construction,
          so a non-zero value on one is a real finding rather than noise.
        data_tests: [not_null]
      - name: days_late_versus_promise
        description: Against the supplier's ASN commitment. Null until arrival.
      - name: days_late_versus_order
        description: >
          Against the purchase order's agreed date. A supplier can hit its own
          re-promised date and still be late against the order, which is why
          both are carried.
      - name: delivery_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - RECONCILED
                  - IN_TRANSIT
                  - SHIPPED_NOT_RECEIVED
                  - QUANTITY_DISCREPANCY
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [inbound_delivery, shipment_item]
