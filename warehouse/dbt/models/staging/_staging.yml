version: 2

models:
  - name: stg_materials
    description: "GRAIN: one row per material. Renamed, typed, units standardised. No joins."
    columns:
      - name: material_number
        description: Material number. Natural key.
        data_tests: [unique, not_null]
      - name: material_group
        description: Component class. Drives the inventory-by-group reporting.
        data_tests: [not_null]
      - name: base_unit_of_measure
        description: >
          Base unit, upper-cased and trimmed here so every downstream quantity
          is comparable. CTRL-011 depends on staging having exactly one rule.
        data_tests: [not_null]
      - name: batch_id
        description: The load batch that landed this row (ADR-008).
        data_tests: [not_null]

  - name: stg_suppliers
    description: "GRAIN: one row per supplier."
    columns:
      - name: supplier_number
        data_tests: [unique, not_null]
      - name: supplier_name
        data_tests: [not_null]

  - name: stg_standard_costs
    description: >
      GRAIN: one row per material per validity window. Exactly one window is
      in force on any date, so an as-of join returns one row (ADR-007).
    columns:
      - name: material_number
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]
      - name: valid_to
        description: 9999-12-31 for the open window -- SAP's convention, and it avoids NULL handling.
        data_tests: [not_null]
      - name: standard_cost_usd
        description: Standard cost. Must be positive; inventory valued at zero is meaningless.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              name: standard_cost_is_positive
              arguments:
                expression: "> 0"
      - name: is_current
        description: True for the open-ended window. Lets "current cost" be a filter.
        data_tests: [not_null]
      - name: approved_by
        description: Who authorised the cost. CTRL-007 joins changes to approvals.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [material_number, valid_from]

  - name: stg_bom_headers
    description: >
      GRAIN: one row per BOM. Shaped on SAP's STKO. `is_released` and
      `is_current` are derived once here so no consumer has to remember that
      an unreleased or expired BOM must not drive component requirements.
    columns:
      - name: bom_number
        data_tests: [unique, not_null]
      - name: parent_material_number
        description: The material this BOM builds.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_materials')
                field: material_number
      - name: base_quantity
        description: Quantity of the parent this BOM's quantities are stated per.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              name: bom_base_quantity_is_positive
              arguments:
                expression: "> 0"
      - name: is_released
        data_tests: [not_null]

  - name: stg_bom_items
    description: >
      GRAIN: one row per BOM line -- a single parent-child edge. Shaped on
      SAP's STPO. Nothing here resolves the hierarchy; int_bom_exploded does,
      in reviewable SQL (ADR-025).
    columns:
      - name: bom_number
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bom_headers')
                field: bom_number
      - name: component_material_number
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_materials')
                field: material_number
      - name: quantity_per
        description: Component quantity per base quantity of the parent.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              name: bom_component_quantity_is_positive
              arguments:
                expression: "> 0"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [bom_number, bom_item]
      # A material cannot be a component of its own BOM. The deeper cycle case
      # needs the recursive walk in assert_bom_has_no_cycles; this catches the
      # one-level case at the column level, where the message is clearer.
      - dbt_utils.expression_is_true:
          name: component_is_not_its_own_parent
          arguments:
            expression: >
              component_material_number <> (
                select parent_material_number from {{ ref('stg_bom_headers') }} as h
                where h.bom_number = stg_bom_items.bom_number
              )

  - name: stg_purchase_order_headers
    description: "GRAIN: one row per purchase order."
    columns:
      - name: po_number
        data_tests: [unique, not_null]
      - name: supplier_number
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_suppliers')
                field: supplier_number

  - name: stg_purchase_order_lines
    description: >
      GRAIN: one row per purchase order LINE. A different grain from the
      header, so a count of purchase orders is ambiguous until a model says
      which it means.
    columns:
      - name: po_number
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_purchase_order_headers')
                field: po_number
      - name: po_item
        data_tests: [not_null]
      - name: material_number
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_materials')
                field: material_number
      - name: quantity_ordered
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              name: quantity_ordered_is_positive
              arguments:
                expression: "> 0"
      - name: net_value_usd
        description: Quantity x unit price, rounded to the cent.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [po_number, po_item]
      - dbt_utils.expression_is_true:
          name: po_line_net_value_is_quantity_times_price
          arguments:
            expression: "net_value_usd = round(quantity_ordered * unit_price_usd, 2)"

  - name: stg_supplier_invoice_headers
    description: "GRAIN: one row per supplier invoice. Shaped on SAP's RBKP."
    columns:
      - name: invoice_number
        data_tests: [not_null]
      - name: supplier_number
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_suppliers')
                field: supplier_number
      - name: gross_amount_usd
        description: Sum of the invoice's lines, asserted below.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [invoice_number, fiscal_year]
      - dbt_utils.expression_is_true:
          name: invoice_posts_on_or_after_its_invoice_date
          arguments:
            expression: "posting_date >= invoice_date"

  - name: stg_supplier_invoice_lines
    description: >
      GRAIN: one row per invoice line. Shaped on SAP's RSEG. The third leg of
      the three-way match: each line references the PO line it pays for.
    columns:
      - name: invoice_number
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_supplier_invoice_headers')
                field: invoice_number
      - name: po_number
        description: >
          The PO line this pays for. Referential integrity is checked by
          CTRL-009 rather than here, because an invoice for a PO that does not
          exist is a control finding to report, not a row to drop from the
          build.
        data_tests: [not_null]
      - name: quantity_invoiced
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              name: invoiced_quantity_is_positive
              arguments:
                expression: "> 0"
      - name: net_amount_usd
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [invoice_number, fiscal_year, invoice_item]
      - dbt_utils.expression_is_true:
          name: invoice_line_amount_is_quantity_times_price
          arguments:
            expression: "net_amount_usd = round(quantity_invoiced * unit_price_usd, 2)"

  - name: stg_production_orders
    description: >
      GRAIN: one row per production order. `is_confirmed` and `is_complete`
      are derived once here so no consumer has to remember which status codes
      count as finished.
    columns:
      - name: order_number
        data_tests: [unique, not_null]
      - name: material_number
        description: The rack configuration being built.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_materials')
                field: material_number
      - name: target_quantity
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              name: order_target_quantity_is_positive
              arguments:
                expression: "> 0"
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["REL", "CNF", "TECO"]
    data_tests:
      - dbt_utils.expression_is_true:
          name: order_starts_before_it_finishes
          arguments:
            expression: "start_date <= finish_date"
      - dbt_utils.expression_is_true:
          name: order_is_raised_before_it_starts
          arguments:
            expression: "order_date <= start_date"

  - name: stg_component_consumption
    description: >
      GRAIN: one row per consumption line. Components issued to a production
      order, following that order's exploded BOM.
    columns:
      - name: order_number
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_production_orders')
                field: order_number
      - name: component_material_number
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_materials')
                field: material_number
      - name: quantity_consumed
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              name: consumed_quantity_is_positive
              arguments:
                expression: "> 0"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_number, consumption_item]

  - name: stg_goods_movements
    description: >
      GRAIN: one row per material document line. Movement type is translated
      into an explicit direction once, here, so a new movement type cannot
      silently get a sign of zero and drop out of the inventory balance.
    columns:
      - name: material_document
        data_tests: [not_null]
      - name: fiscal_year
        description: Part of the natural key -- document numbers repeat across years (ADR-020).
        data_tests: [not_null]
      - name: movement_direction
        description: RECEIPT or ISSUE, derived from the movement type.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["RECEIPT", "ISSUE"]
      - name: material_number
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_materials')
                field: material_number
      - name: quantity
        description: Signed by movement type. Never zero -- a movement of nothing is a parsing fault.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              name: movement_quantity_is_never_zero
              arguments:
                expression: "<> 0"
      - name: amount_usd
        description: Valued at the standard cost in force on the POSTING date.
        data_tests: [not_null]
      - name: posting_date
        description: The reporting basis (docs/metric_definitions.md).
        data_tests: [not_null]
      - name: posting_period
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [material_document, fiscal_year, material_document_item]
      # A receipt adds, an issue subtracts. Getting this backwards inverts the
      # balance sheet, so it is asserted rather than assumed.
      - dbt_utils.expression_is_true:
          name: receipts_increase_inventory
          arguments:
            expression: "quantity > 0"
            config:
              where: "movement_direction = 'RECEIPT'"
      - dbt_utils.expression_is_true:
          name: issues_decrease_inventory
          arguments:
            expression: "quantity < 0"
            config:
              where: "movement_direction = 'ISSUE'"
      # Paperwork is raised on or before the posting hits the books.
      - dbt_utils.expression_is_true:
          name: document_date_not_after_posting_date
          arguments:
            expression: "document_date <= posting_date"

  - name: stg_inventory_revaluations
    description: >
      GRAIN: one row per revaluation document. Value-only entries posted when
      a standard cost changes (ADR-023). No quantity, because nothing moved.
    columns:
      - name: revaluation_document
        data_tests: [not_null]
      - name: material_number
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_materials')
                field: material_number
      - name: quantity_on_hand
        description: Stock revalued. Positive -- revaluing nothing would post a zero entry.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              name: revalued_quantity_is_positive
              arguments:
                expression: "> 0"
      - name: amount_usd
        description: Cost delta x quantity on hand.
        data_tests: [not_null]
      - name: approved_by
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [revaluation_document, fiscal_year]
      - dbt_utils.expression_is_true:
          name: revaluation_amount_is_delta_times_quantity
          arguments:
            expression: "amount_usd = round(cost_delta_usd * quantity_on_hand, 2)"

  - name: stg_gl_postings
    description: "GRAIN: one row per accounting document line."
    columns:
      - name: accounting_document
        data_tests: [not_null]
      - name: posting_direction
        description: DEBIT or CREDIT, from the SAP S/H indicator.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["DEBIT", "CREDIT"]
      - name: gl_account
        data_tests: [not_null]
      - name: signed_amount_usd
        description: Debits positive, credits negative, so a net movement is a plain sum.
        data_tests: [not_null]
      - name: reference_document
        description: The material document or revaluation document that caused the posting.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [accounting_document, fiscal_year, line_item]
      # The sign convention must follow the indicator, or a period's net
      # movement is wrong in a way that still looks plausible.
      - dbt_utils.expression_is_true:
          name: debits_are_positive
          arguments:
            expression: "signed_amount_usd = amount_usd"
            config:
              where: "posting_direction = 'DEBIT'"
      - dbt_utils.expression_is_true:
          name: credits_are_negative
          arguments:
            expression: "signed_amount_usd = -amount_usd"
            config:
              where: "posting_direction = 'CREDIT'"

  - name: stg_mes_unit_events
    description: >
      GRAIN: one row per serial per step attempt. The grain the whole MES story
      rests on -- 5,000,000 rows on the full profile.

      `passed_first_time` is derived here so first-pass yield means one thing
      across the warehouse: a reworked unit that later passes is complete but
      is NOT a first-pass success.
    columns:
      - name: serial_number
        data_tests: [not_null]
      - name: order_number
        description: Every serial belongs to an order, so MES and ERP reconcile.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_production_orders')
                field: order_number
      - name: result
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["PASS", "FAIL"]
      - name: passed_first_time
        data_tests: [not_null]
      - name: dwell_hours
        description: Hours on this attempt. Burn-in dominates the route.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [serial_number, step_sequence, attempt]
      - dbt_utils.expression_is_true:
          name: event_finishes_after_it_starts
          arguments:
            expression: "finished_at >= started_at"
      # A failure without a code cannot be diagnosed; a pass with one is a
      # contradiction.
      - dbt_utils.expression_is_true:
          name: failures_carry_a_failure_code
          arguments:
            expression: "failure_code is not null"
            config:
              where: "result = 'FAIL'"
      - dbt_utils.expression_is_true:
          name: passes_carry_no_failure_code
          arguments:
            expression: "failure_code is null"
            config:
              where: "result = 'PASS'"

  - name: stg_shipment_headers
    description: >
      GRAIN: one row per inbound delivery.

      Carries `days_late` but deliberately no on-time flag: whether on time
      means exact or allows a tolerance window, and whether it is measured by
      line or by shipment, are open questions for BTB-44
      (docs/metric_definitions.md). A flag here would answer them by accident.
    columns:
      - name: inbound_delivery
        data_tests: [unique, not_null]
      - name: supplier_number
        description: >
          Nullable: the `missing_supplier_on_shipment` defect nulls it and
          CTRL-009 detects it.
      - name: shipped_date
        data_tests: [not_null]
      - name: promised_arrival_date
        data_tests: [not_null]
      - name: days_late
        description: >
          Arrived minus promised. Positive is late, negative is early, null
          means not yet arrived -- null rather than zero, because zero would
          count an unarrived shipment as on time.
      - name: is_received
        data_tests: [not_null]
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["RECEIVED", "IN_TRANSIT"]

  - name: stg_shipment_lines
    description: >
      GRAIN: one row per purchase order line per inbound delivery.
    columns:
      - name: inbound_delivery
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shipment_headers')
                field: inbound_delivery
      - name: po_number
        data_tests: [not_null]
      - name: quantity_shipped
        data_tests: [not_null]
      - name: material_number
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_material_current')
                field: material_number
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [inbound_delivery, shipment_item]
      # The reconciliation key. Merging receipt splits at source is what makes
      # this hold; one line per receipt row left two deliveries with duplicate
      # order lines.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [inbound_delivery, po_number, po_item]

  - name: stg_production_confirmations
    description: >
      GRAIN: one row per confirmation. Derived from the MES outcome, so
      CTRL-005 reconciles exactly on a clean run.
    columns:
      - name: order_number
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_production_orders')
                field: order_number
      - name: confirmed_quantity
        data_tests: [not_null]
      - name: accounted_quantity
        description: Confirmed plus scrapped. A unit in neither has vanished.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_number, confirmation_number]
