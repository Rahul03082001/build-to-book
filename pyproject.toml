[project]
name = "build-to-book"
version = "0.1.0"
description = "Manufacturing data pipeline and inventory reconciliation with SOX-style controls (synthetic data)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pandera>=0.20",
    "Faker>=25.0",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.1",
    "SQLAlchemy>=2.0",
    "sqlglot>=25.0",
    "python-dotenv>=1.0",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dbt = ["dbt-core>=1.8", "dbt-postgres>=1.8"]
app = ["streamlit>=1.35", "altair>=5.3"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "sqlfluff>=3.0",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator", "ingestion", "controls", "lineage"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "warehouse/dbt/target", "warehouse/dbt/dbt_packages", "evidence", "exports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires a live PostgreSQL database (deselect with '-m \"not integration\"')",
    "slow: runs against the full data profile",
]
