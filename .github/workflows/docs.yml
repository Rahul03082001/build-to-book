# Publish dbt docs to GitHub Pages on every merge to main (BTB-57).
#
# Deploying from a custom Actions workflow means the Pages 10-builds-per-hour
# soft limit does not apply (ADR-015), so docs can be republished on every
# merge. The published URL is one of the live demo links.

name: dbt docs

on:
  # Phase 5 (BTB-57) restores the push trigger. Until the job actually
  # generates docs it would fail on every merge, and a permanently red check
  # teaches people to ignore CI.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Generate dbt docs
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: btb
          POSTGRES_USER: btb_admin
          POSTGRES_PASSWORD: ci_only_not_a_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U btb_admin -d btb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install the project
        run: uv sync --extra dbt

      - name: Not yet built
        run: |
          echo "::notice::dbt docs publishing lands in Phase 5 (BTB-57)."
          exit 1

      # Phase 5 replaces the step above with:
      # - name: dbt docs generate
      #   run: uv run dbt docs generate --project-dir warehouse/dbt --target ci
      # - uses: actions/configure-pages@v5
      # - uses: actions/upload-pages-artifact@v3
      #   with:
      #     path: warehouse/dbt/target
      # and a deploy job using actions/deploy-pages@v4.
