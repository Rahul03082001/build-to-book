# Lint, tests, and (from Phase 1) dbt build plus reconciliations on every PR.
#
# These are the required status checks that stand in for a second approver
# (ADR-011). A human cannot wave them through.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # -------------------------------------------------------------------------
  # Change management: every change traces to a story (ADR-011).
  # -------------------------------------------------------------------------
  jira-key:
    name: PR title carries a Jira key
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^BTB-[0-9]+:\  ]]; then
            echo "::error::PR title must start with a Jira key, e.g. 'BTB-12: add goods receipt staging model'"
            echo "Got: $PR_TITLE"
            exit 1
          fi
          echo "OK: $PR_TITLE"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install the project
        run: uv sync --extra dev

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check .

      - name: sqlfluff
        run: |
          if [ -n "$(find warehouse/dbt/models -name '*.sql' -print -quit 2>/dev/null)" ]; then
            uv run sqlfluff lint warehouse/dbt/models warehouse/dbt/tests
          else
            echo "No dbt models yet; skipping."
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest

    # The warehouse is needed from Phase 1 onward. It starts now so the
    # integration tests have somewhere to run as soon as they exist.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: btb
          POSTGRES_USER: btb_admin
          POSTGRES_PASSWORD: ci_only_not_a_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U btb_admin -d btb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: btb
      POSTGRES_USER: btb_admin
      POSTGRES_PASSWORD: ci_only_not_a_secret
      BTB_PROFILE: demo
      # Ephemeral CI database, destroyed with the job. Real credentials live
      # in the `hosted-demo` environment secrets.
      BTB_LOADER_PASSWORD: ci_only_not_a_secret
      BTB_TRANSFORMER_PASSWORD: ci_only_not_a_secret
      BTB_REPORTER_PASSWORD: ci_only_not_a_secret
      BTB_AUDITOR_PASSWORD: ci_only_not_a_secret

    steps:
      - uses: actions/checkout@v7
        with:
          # The audit trail records the commit SHA that produced each run,
          # so CI needs real history rather than a shallow clone.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install the project
        run: uv sync --extra dev --extra dbt

      - name: Create the schemas
        # The service container skips docker-entrypoint-initdb.d, so the
        # bootstrap file that `docker compose up` would run must be applied here.
        run: |
          export PGPASSWORD="$POSTGRES_PASSWORD"
          psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -f warehouse/sql/init/00_schemas.sql

      - name: Apply roles and tables
        # The same target `make init` uses, so CI cannot drift from local when
        # a new schema file is added -- which is exactly what happened when
        # raw.sql and audit.sql landed and this step still only ran `make roles`.
        run: make schemas

      - name: Run tests
        # Includes the integration tests, so every PR re-proves that each role
        # is denied what it should not reach (CTRL-013).
        run: uv run pytest -ra --cov=. --cov-report=term-missing

      # BTB-51: every PR runs the pipeline against a freshly generated
      # dataset, so a model that breaks a business rule cannot be merged. This
      # replaces the placeholder job that used to report success while running
      # nothing.
      - name: Install dbt dependencies
        run: make dbt-deps

      - name: Generate the demo profile
        run: make data

      - name: Load into raw
        run: make load

      - name: dbt build (models + tests)
        run: make build

      - name: Run the reconciliations
        run: make controls

      - name: Publish through the gate
        run: make publish

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target-${{ github.run_id }}
          path: warehouse/dbt/target/
          retention-days: 7
          if-no-files-found: ignore
